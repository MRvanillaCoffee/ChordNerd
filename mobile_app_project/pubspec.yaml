name: chord_nerd
description: "Chord Nerd — practice tracking, chord search, and your song library, built for guitarists who love the dark and a little violet."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # State management
  flutter_riverpod: ^2.6.1

  # Networking (Uberchord API calls)
  http: ^1.2.2

  # Fonts (Space Grotesk + Manrope)
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  # Google sign-in
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/

  # fonts:
  #   Not needed if using google_fonts package (fetched at runtime).
  #   Uncomment below only if bundling .ttf files locally instead:
  #   - family: SpaceGrotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
  #         weight: 600
  #   - family: Manrope
  #     fonts:
  #       - asset: assets/fonts/Manrope-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Manrope-Medium.ttf
  #         weight: 500
